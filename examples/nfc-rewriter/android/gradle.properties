# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m

# React Native 0.85 / Gradle 8.x require JDK 17-21; the system default here is
# JDK 25/21, which can fail to resolve the com.facebook.react.settings plugin.
# Pin the build to JDK 17. Adjust this path (or remove it and set JAVA_HOME)
# if your JDK lives elsewhere.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

android.useAndroidX=true

reactNativeArchitectures=arm64-v8a,x86_64

newArchEnabled=true

hermesEnabled=true

android.enableJetifier=false
